name: windows-build

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show toolchain
        run: dotnet --info

      - name: Run unit tests (Core) — gate
        run: dotnet test tests/WeChatMulti.Core.Tests/WeChatMulti.Core.Tests.csproj -c Release

      - name: Build app (pulls in Core + Native)
        run: dotnet build src/WeChatMulti.App/WeChatMulti.App.csproj -c Release

      - name: Publish self-contained (x64 + arm64)
        run: |
          dotnet publish src/WeChatMulti.App/WeChatMulti.App.csproj -c Release -r win-x64 --self-contained -o publish/win-x64
          dotnet publish src/WeChatMulti.App/WeChatMulti.App.csproj -c Release -r win-arm64 --self-contained -o publish/win-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WeChatMulti-windows
          path: windows/publish/**
          if-no-files-found: error
